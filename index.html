<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一般常識クイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container">
    <header class="quiz-header">
      <h1>一般常識クイズ</h1>
      <div class="progress">
        <span id="question-number">1</span> / <span id="total-questions">5</span> 問
      </div>
    </header>

    <main id="quiz-screen" class="quiz-screen">
      <p id="question-text" class="question-text"></p>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback hidden"></div>
      <button id="next-btn" class="next-btn hidden">次の問題へ</button>
    </main>

    <section id="result-screen" class="result-screen hidden">
      <h2>結果発表</h2>
      <p id="score-text" class="score-text"></p>
      <button id="restart-btn" class="restart-btn">もう一度挑戦する</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
